name: Patch vbmeta

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - model: "SM-S921B"
            csc: "EUX"
            omc: "OXM"
            imei: "350070120202022"
            codename: "e1s"

          - model: "SM-A266B"
            csc: "EUX"
            omc: "OXM"
            imei: "350439761193107"
            codename: "a26x"

          - model: "SM-A356B"
            csc: "EUX"
            omc: "OXM"
            imei: "355088506557251"
            codename: "a35x"
            
          - model: "SM-A505G"
            csc: "CHO"
            imei: "357285110000000"
            codename: "a505f"


    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          preinstalled-runtimes: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Check latest firmware
        run: |
          latest=$(curl -s "http://fota-cloud-dn.ospserver.net/firmware/${{ matrix.csc }}/${{ matrix.model }}/version.xml" \
          | grep latest | sed 's/^[^>]*>//' | sed 's/<.*//')

          echo "latest=$latest" >> $GITHUB_ENV

          if [ -f "current_${{ matrix.model }}_${{ matrix.csc }}" ]; then
            current=$(cat current_${{ matrix.model }}_${{ matrix.csc }})
          else
            current=""
          fi

          if [ "$latest" != "$current" ]; then
            echo "need_update=1" >> $GITHUB_ENV
          else
            echo "need_update=0" >> $GITHUB_ENV
          fi

      - name: Install dependencies
        if: env.need_update == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4 unzip python3 python3-venv git curl

      - name: Install samloader
        if: env.need_update == '1'
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install git+https://github.com/ananjaser1211/samloader.git

      - name: Download firmware and extract BL
        if: env.need_update == '1'
        run: |
          source venv/bin/activate
          mkdir -p fw

          samloader -m ${{ matrix.model }} -r ${{ matrix.csc }} -i ${{ matrix.imei }} download -O fw

          # Extract ONLY BL tar.md5 to prevent disk space issues
          unzip -j fw/*.zip "BL*" -d fw/
          rm -f fw/*.zip

      - name: Extract vbmeta
        if: env.need_update == '1'
        run: |
          # Extract vbmeta.img.lz4 from BL tar.md5
          tar xvf fw/BL*.tar.md5 vbmeta.img.lz4
          lz4 -d vbmeta.img.lz4 vbmeta.img
          rm -rf fw/

      - name: Patch vbmeta
        if: env.need_update == '1'
        run: |
          cp vbmeta.img vbmeta_patched.img
          printf '\x03' | dd of=vbmeta_patched.img bs=1 seek=123 count=1 conv=notrunc

      - name: Create release package
        if: env.need_update == '1'
        run: |
          mkdir -p out
          cp vbmeta.img out/
          cp vbmeta_patched.img out/
          tar -cf "${{ matrix.codename }}_vbmeta_${{ env.latest }}.tar" -C out .

      - name: Save version
        if: env.need_update == '1'
        run: |
          echo "${{ env.latest }}" > "current_${{ matrix.model }}_${{ matrix.csc }}"

      - name: Commit version file
        if: env.need_update == '1'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add "current_${{ matrix.model }}_${{ matrix.csc }}"
          git commit -m "Update firmware ${{ matrix.model }} ${{ env.latest }}" || true
          git push

      - name: Create release
        if: env.need_update == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ matrix.codename }}-${{ env.latest }}"
          name: "${{ matrix.model }} ${{ env.latest }}"
          files: |
            ${{ matrix.codename }}_vbmeta_${{ env.latest }}.tar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
